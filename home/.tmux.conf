# # ==============================================================================
# # --- General Settings ---
# # ==============================================================================
#
# # Prefix を Ctrl-g に変更
set-option -g prefix C-g
unbind-key C-b
bind-key C-g send-prefix

# デフォルトのターミナル設定 (True Color サポート)
set-option -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# 基本オプション
set-option -g focus-events on
set-option -g escape-time 10
set-option -g history-limit 9999
set-option -g repeat-time 200
set-option -g status-interval 1
set-option -g status-position top
#
# # 設定ファイルの再読み込み
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded!"
#
# # ==============================================================================
# # --- UI & Styles ---
# # ==============================================================================
#
set-option -g status-style "bg=default"
set-option -g status-bg default
set-option -g status-fg colour15

# 2. 検索・コピーモードのハイライト (画像内の黄色い部分)
# 背景は透明のまま、文字と背景を反転(reverse)させて表現
# set-option -g mode-style "fg=colour6,bg=default,reverse,bold"
set-option -g mode-style "fg=colour15,bg=colour238"

# 3. メッセージライン (Reloaded! など) も透明に
set-option -g message-style "fg=colour6,bg=default,reverse"

# 4. ペインの境界線
set-option -g pane-border-style "fg=colour239"
set-option -g pane-active-border-style "fg=colour6"

# --- Statusline Design (背景を一切塗らない) ---

# 左側: セッション名
# bg=default を明示し、セパレータも細い線(|)に変更してスッキリさせます
set-option -g status-left "#[fg=colour6,bg=default,bold]  #S #[fg=colour239,bg=default,nobold] | "

# 右側: 日付・時刻・ホスト
set-option -g status-right "#[fg=colour244,bg=default] 󰃭 %Y-%m-%d  󱑎 %H:%M #[fg=colour6,bg=default,bold] 󰒋 #h "

# ウィンドウリスト
set-option -g window-status-separator "  "

# 非アクティブウィンドウ
set-option -g window-status-format "#[fg=colour244,bg=default] #I:#W "

# アクティブウィンドウ (ここも背景を塗らず、アイコンと色だけで強調)
set-option -g window-status-current-format "#[fg=colour6,bg=default,bold]  #I:#W "
#
# # ==============================================================================
# # --- Navigation & Key Bindings ---
# # ==============================================================================

# ペイン移動 (Vim-like)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ペインサイズ変更
bind-key -r H resize-pane -L 2
bind-key -r J resize-pane -D 2
bind-key -r K resize-pane -U 2
bind-key -r L resize-pane -R 2

# ウィンドウ分割
bind-key - split-window -v
bind-key | split-window -h
#
# # ==============================================================================
# # --- Copy Mode (Vi-style) ---
# # ==============================================================================
#
# コピーモードのキーバインドを vi に設定
setw -g mode-keys vi

# Copy Mode の開始 (Prefix + [)
bind-key [ copy-mode

# 選択とコピーの挙動
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# / で順方向検索、? で逆方向検索を明確に定義
bind-key -T copy-mode-vi / command-prompt -p "(search down)" "send -X search-forward \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -p "(search up)" "send -X search-backward \"%%%\""

# 検索の続き
bind-key -T copy-mode-vi N send-keys -X search-again
bind-key -T copy-mode-vi n send-keys -X search-reverse

# ページスクロール
bind-key -T copy-mode-vi b send-keys -X page-up
bind-key -T copy-mode-vi f send-keys -X page-down
